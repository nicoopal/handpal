name: Release

# Push a tag like v0.2.0 to build Handpal.exe and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Handpal.exe
        shell: cmd
        run: build.bat
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\Handpal -DestinationPath "Handpal-${{ github.ref_name }}-windows.zip"
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" "Handpal-${{ github.ref_name }}-windows.zip"
          --title "Handpal ${{ github.ref_name }}" --generate-notes
